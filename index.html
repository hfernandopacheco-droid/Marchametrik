<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#080B11">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <meta name="apple-mobile-web-app-title" content="LitroMetrik PRO">
    <title>LitroMetrik PRO - Navegador GPS & Calculadora de Combustible en PLN</title>
    <meta name="description" content="LitroMetrik PRO - Calculadora avanzada y navegador en tiempo real para Polonia." />
    <meta property="og:title" content="LitroMetrik PRO" />
    <meta property="og:description" content="LitroMetrik PRO - Navegador GPS y Calculadora de Combustible en PLN." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    
    <!-- PWA & Mobile Meta Tags (Forced Cache Busting v14 with Full-Bleed Icons) -->
    <link rel="manifest" href="/manifest.json?v=14" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icon-180.png?v=14" />
    <link rel="icon" type="image/png" sizes="512x512" href="/icon-512.png?v=14" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png?v=14" />
    <link rel="shortcut icon" href="/icon-192.png?v=14" />

    <!-- MapLibre GL JS CDN -->
    <link href='https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.css' rel='stylesheet' />
    <script src='https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.js'></script>
    
    <!-- Google Maps JS API (Places, Geometry, Geocoding, Routes) with provisioned Key -->
    <script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyBgO6rR8V3B3G2lZYtJV7Lvop8aNDXNYfc&libraries=places,geometry,routes&language=pl&region=pl"></script>
  </head>
  <body style="background:#080B11; margin:0; padding:0; -webkit-tap-highlight-color: transparent;">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Service Worker Registration for PWA without reload flaps
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker
            .register('/sw.js', { scope: '/' })
            .then((registration) => {
              console.log('[SW] Registered successfully with scope:', registration.scope);
            })
            .catch((err) => {
              console.warn('[SW] Registration note:', err);
            });
        });
      }
    </script>
  </body>
</html>
