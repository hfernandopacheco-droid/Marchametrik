
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Full Bleed Blue Gradient Background -->
    <linearGradient id="fullBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E88E5" />
      <stop offset="25%" stop-color="#0066FF" />
      <stop offset="70%" stop-color="#004FD6" />
      <stop offset="100%" stop-color="#0039A6" />
    </linearGradient>

    <!-- Top Highlight Gloss Reflection -->
    <linearGradient id="glossHighlight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.38" />
      <stop offset="40%" stop-color="#FFFFFF" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
    </linearGradient>

    <!-- Pump Dispenser Unit Body Gradient -->
    <linearGradient id="pumpGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#42A5F5" />
      <stop offset="45%" stop-color="#1976D2" />
      <stop offset="100%" stop-color="#0D47A1" />
    </linearGradient>

    <!-- Screen Gradient -->
    <linearGradient id="screenGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0A2558" />
      <stop offset="100%" stop-color="#061838" />
    </linearGradient>

    <!-- 3D White Elements Gradient -->
    <linearGradient id="white3DGloss" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="80%" stop-color="#F1F5F9" />
      <stop offset="100%" stop-color="#CBD5E1" />
    </linearGradient>

    <!-- Soft 3D Element Shadow -->
    <filter id="elementShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="10" flood-color="#00184A" flood-opacity="0.6" />
    </filter>
  </defs>

  <!-- FULL BLEED BACKGROUND (100% width and height, NO black margin!) -->
  <rect width="512" height="512" fill="url(#fullBg)" />

  <!-- Top Half Soft Glass Shine -->
  <rect width="512" height="260" fill="url(#glossHighlight)" />

  <!-- Typography: LitroMetrik PRO -->
  <text x="256" y="112" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, sans-serif" font-size="38" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="-0.5" filter="drop-shadow(0 2px 4px rgba(0,0,0,0.3))">
    LitroMetrik PRO
  </text>

  <!-- Main 3D Pump Unit -->
  <g filter="url(#elementShadow)">
    <!-- Pump Chassis Outer (Rounded Rectangle) -->
    <rect x="160" y="148" width="148" height="246" rx="42" fill="url(#pumpGradient)" stroke="#64B5F6" stroke-width="3.5" />
    <rect x="165" y="152" width="138" height="74" rx="36" fill="url(#glossHighlight)" />

    <!-- Digital Screen -->
    <rect x="182" y="176" width="104" height="52" rx="16" fill="url(#screenGradient)" stroke="#09255E" stroke-width="2" />
    <!-- 0.00 L Screen Text -->
    <text x="234" y="211" font-family="-apple-system, BlinkMacSystemFont, 'SF Mono', 'Roboto Mono', monospace" font-size="24" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="-0.5">
      0.00 L
    </text>

    <!-- 3 Pill Selection Buttons -->
    <rect x="188" y="240" width="24" height="10" rx="5" fill="url(#white3DGloss)" filter="drop-shadow(0 2px 2px rgba(0,0,0,0.3))" />
    <rect x="222" y="240" width="24" height="10" rx="5" fill="url(#white3DGloss)" filter="drop-shadow(0 2px 2px rgba(0,0,0,0.3))" />
    <rect x="256" y="240" width="24" height="10" rx="5" fill="url(#white3DGloss)" filter="drop-shadow(0 2px 2px rgba(0,0,0,0.3))" />

    <!-- 3x3 Keypad (9 glossy buttons) -->
    <!-- Row 1 -->
    <rect x="196" y="266" width="22" height="18" rx="6" fill="url(#white3DGloss)" filter="drop-shadow(0 2px 3px rgba(0,0,0,0.35))" />
    <rect x="223" y="266" width="22" height="18" rx="6" fill="url(#white3DGloss)" filter="drop-shadow(0 2px 3px rgba(0,0,0,0.35))" />
    <rect x="250" y="266" width="22" height="18" rx="6" fill="url(#white3DGloss)" filter="drop-shadow(0 2px 3px rgba(0,0,0,0.35))" />

    <!-- Row 2 -->
    <rect x="196" y="291" width="22" height="18" rx="6" fill="url(#white3DGloss)" filter="drop-shadow(0 2px 3px rgba(0,0,0,0.35))" />
    <rect x="223" y="291" width="22" height="18" rx="6" fill="url(#white3DGloss)" filter="drop-shadow(0 2px 3px rgba(0,0,0,0.35))" />
    <rect x="250" y="291" width="22" height="18" rx="6" fill="url(#white3DGloss)" filter="drop-shadow(0 2px 3px rgba(0,0,0,0.35))" />

    <!-- Row 3 -->
    <rect x="196" y="316" width="22" height="18" rx="6" fill="url(#white3DGloss)" filter="drop-shadow(0 2px 3px rgba(0,0,0,0.35))" />
    <rect x="223" y="316" width="22" height="18" rx="6" fill="url(#white3DGloss)" filter="drop-shadow(0 2px 3px rgba(0,0,0,0.35))" />
    <rect x="250" y="316" width="22" height="18" rx="6" fill="url(#white3DGloss)" filter="drop-shadow(0 2px 3px rgba(0,0,0,0.35))" />

    <!-- Bottom Accent Bar -->
    <rect x="196" y="344" width="76" height="6" rx="3" fill="url(#white3DGloss)" filter="drop-shadow(0 2px 2px rgba(0,0,0,0.3))" />
  </g>

  <!-- Attached Gas Nozzle & Flexible White Hose on Right Side -->
  <g filter="url(#elementShadow)">
    <!-- Flexible White Hose (Smooth U-loop) -->
    <path d="M 308 274 C 308 380, 368 380, 368 266" fill="none" stroke="url(#white3DGloss)" stroke-width="14" stroke-linecap="round" />
    
    <!-- Nozzle Handle and Spout Assembly -->
    <g transform="translate(316, 172)">
      <!-- Main Nozzle Grip Body -->
      <path d="M 28 20 L 42 34 L 44 88 C 44 94, 34 98, 30 94 L 26 56 L 8 36 Z" fill="url(#white3DGloss)" stroke="#94A3B8" stroke-width="1.5" />
      <!-- Trigger Guard and Lever -->
      <path d="M 26 50 C 12 50, 10 76, 24 78 L 28 78" fill="none" stroke="url(#white3DGloss)" stroke-width="6" stroke-linecap="round" />
      <path d="M 20 58 L 20 70" stroke="#334155" stroke-width="3.5" stroke-linecap="round" />
      <!-- Spout Tube reaching up & curved -->
      <path d="M 28 20 L 6 -4" stroke="url(#white3DGloss)" stroke-width="9" stroke-linecap="round" />
      <path d="M 6 -4 L -14 -8" stroke="url(#white3DGloss)" stroke-width="7" stroke-linecap="round" />
    </g>
  </g>
</svg>
