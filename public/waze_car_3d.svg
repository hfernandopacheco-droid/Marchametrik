<svg width="256" height="256" viewBox="0 0 256 256" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Soft Ambient Ground Shadow -->
    <filter id="groundShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="8" />
    </filter>
    <filter id="lightGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2.5" />
    </filter>

    <!-- Linear Gradients for 3D Shading -->
    <linearGradient id="bodyBlueGrad" x1="50" y1="60" x2="210" y2="210" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#88BDE8" />
      <stop offset="35%" stop-color="#6FAFE0" />
      <stop offset="70%" stop-color="#5599D0" />
      <stop offset="100%" stop-color="#3D7DB5" />
    </linearGradient>

    <linearGradient id="roofWhiteGrad" x1="90" y1="50" x2="190" y2="150" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="60%" stop-color="#F1F5F9" />
      <stop offset="100%" stop-color="#CBD5E1" />
    </linearGradient>

    <linearGradient id="windowGrad" x1="70" y1="70" x2="180" y2="160" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#5A7490" />
      <stop offset="50%" stop-color="#3F5874" />
      <stop offset="100%" stop-color="#283B52" />
    </linearGradient>

    <linearGradient id="wheelRubber" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#64748B" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>

    <linearGradient id="rimGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#E2E8F0" />
      <stop offset="100%" stop-color="#94A3B8" />
    </linearGradient>

    <linearGradient id="amberLight" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FDE047" />
      <stop offset="40%" stop-color="#FBBF24" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
  </defs>

  <!-- 1. Realistic Drop Shadow under vehicle -->
  <ellipse cx="128" cy="188" rx="84" ry="42" fill="#000000" fill-opacity="0.38" filter="url(#groundShadow)" />

  <!-- 2. Wheels (3D Isometric view) -->
  <!-- Front-Left Wheel -->
  <g id="frontLeftWheel">
    <ellipse cx="64" cy="148" rx="16" ry="24" fill="url(#wheelRubber)" />
    <ellipse cx="61" cy="148" rx="10" ry="17" fill="url(#rimGrad)" />
    <!-- 4 Rim holes -->
    <circle cx="58" cy="142" r="2.8" fill="#475569" />
    <circle cx="64" cy="143" r="2.8" fill="#475569" />
    <circle cx="58" cy="153" r="2.8" fill="#475569" />
    <circle cx="64" cy="154" r="2.8" fill="#475569" />
    <circle cx="61" cy="148" r="2.5" fill="#334155" />
  </g>

  <!-- Rear-Left Wheel -->
  <g id="rearLeftWheel">
    <ellipse cx="132" cy="192" rx="18" ry="26" fill="url(#wheelRubber)" />
    <ellipse cx="129" cy="192" rx="11" ry="18" fill="url(#rimGrad)" />
    <!-- 4 Rim holes -->
    <circle cx="126" cy="186" r="3.2" fill="#475569" />
    <circle cx="132" cy="187" r="3.2" fill="#475569" />
    <circle cx="126" cy="197" r="3.2" fill="#475569" />
    <circle cx="132" cy="198" r="3.2" fill="#475569" />
    <circle cx="129" cy="192" r="2.8" fill="#334155" />
  </g>

  <!-- 3. Main Isometric Blue Car Body Shell -->
  <!-- Main Fender & Body Curve -->
  <path d="M 52 128 C 45 110 58 84 82 72 C 104 60 138 58 168 70 C 196 82 216 106 218 132 C 220 156 206 174 186 182 C 160 192 124 196 98 190 C 76 184 56 168 52 142 Z" 
        fill="url(#bodyBlueGrad)" />

  <!-- Front Bumper & Grill Curve -->
  <path d="M 44 126 C 41 123 44 116 50 114 L 62 108 C 65 112 62 124 54 130 Z" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5" />
  <path d="M 46 120 L 52 117" stroke="#475569" stroke-width="1.5" stroke-linecap="round" />

  <!-- Rear Bumper & License Plate Area -->
  <path d="M 178 164 C 182 162 198 152 202 150 C 204 154 200 162 188 168 Z" fill="#1E293B" />
  <rect x="178" y="162" width="18" height="11" rx="2.5" fill="#0F172A" stroke="#475569" stroke-width="1.2" transform="rotate(-18 178 162)" />

  <!-- Door line seam -->
  <path d="M 112 124 C 110 144 108 162 106 174" stroke="#3D7DB5" stroke-width="2.2" stroke-linecap="round" fill="none" opacity="0.6" />
  <!-- Door handle -->
  <rect x="94" y="136" width="9" height="3" rx="1.5" fill="#334155" opacity="0.5" />

  <!-- 4. Rounded White Cabin & Roof Shell (Authentic 3D Mini/Waze Dome) -->
  <path d="M 72 108 C 66 94 76 72 98 62 C 122 52 158 52 178 68 C 196 82 202 102 198 122 C 194 136 178 144 154 148 C 124 152 82 144 72 120 Z" 
        fill="url(#roofWhiteGrad)" stroke="#FFFFFF" stroke-width="2.5" />

  <!-- Roof Top Dome Surface -->
  <path d="M 94 66 C 114 54 152 54 172 68 C 186 78 188 94 182 106 C 172 120 134 126 112 118 C 96 112 84 94 88 78 Z" 
        fill="#FFFFFF" />
  
  <!-- Subtle roof antenna fin -->
  <ellipse cx="118" cy="68" rx="6" ry="4" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1" />

  <!-- 5. 3D Dark Tinted Windows with Gloss Reflections -->
  <!-- Front Windshield -->
  <path d="M 76 104 C 74 96 78 84 88 78 C 98 72 112 70 120 74 L 112 98 C 102 98 84 102 76 104 Z" 
        fill="url(#windowGrad)" />
  <path d="M 80 94 L 88 84 L 98 82 L 86 98 Z" fill="#FFFFFF" fill-opacity="0.22" />

  <!-- Side Front Window -->
  <path d="M 80 114 C 76 116 74 122 76 128 C 82 136 94 140 102 138 L 106 116 C 98 114 88 112 80 114 Z" 
        fill="url(#windowGrad)" />
  <path d="M 82 120 L 98 116 L 96 128 L 82 132 Z" fill="#FFFFFF" fill-opacity="0.2" />

  <!-- Side Rear Window -->
  <path d="M 112 116 L 108 138 C 122 140 134 136 140 126 L 138 112 C 128 112 118 114 112 116 Z" 
        fill="url(#windowGrad)" />

  <!-- Rear Windshield (Large curved glass) -->
  <path d="M 148 112 L 152 144 C 170 142 188 132 192 118 C 196 106 190 94 182 88 C 172 80 158 84 152 92 Z" 
        fill="url(#windowGrad)" />
  <path d="M 158 98 L 178 94 C 184 102 186 112 184 122 L 168 132 Z" fill="#FFFFFF" fill-opacity="0.18" />

  <!-- 6. Iconic 3D Round Amber/Yellow Headlights & Taillights -->
  <!-- Front-Left Headlight -->
  <g id="frontLeftHeadlight">
    <ellipse cx="44" cy="108" rx="8.5" ry="11" fill="url(#amberLight)" />
    <ellipse cx="44" cy="108" rx="8.5" ry="11" fill="#FEF08A" fill-opacity="0.5" filter="url(#lightGlow)" />
    <ellipse cx="42" cy="105" rx="3.5" ry="4.5" fill="#FFFFFF" fill-opacity="0.75" />
  </g>

  <!-- Front-Right Headlight (peeking over hood) -->
  <g id="frontRightHeadlight">
    <ellipse cx="88" cy="74" rx="7" ry="8.5" fill="url(#amberLight)" />
    <ellipse cx="86" cy="72" rx="2.5" ry="3.5" fill="#FFFFFF" fill-opacity="0.7" />
  </g>

  <!-- Rear-Left Taillight -->
  <g id="rearLeftTaillight">
    <ellipse cx="154" cy="164" rx="9" ry="12" fill="url(#amberLight)" />
    <ellipse cx="152" cy="161" rx="3.5" ry="4.8" fill="#FFFFFF" fill-opacity="0.7" />
  </g>

  <!-- Rear-Right Taillight -->
  <g id="rearRightTaillight">
    <ellipse cx="210" cy="132" rx="8" ry="11" fill="url(#amberLight)" />
    <ellipse cx="208" cy="129" rx="3" ry="4.5" fill="#FFFFFF" fill-opacity="0.7" />
  </g>

  <!-- Tiny Bottom Indicator Light -->
  <circle cx="162" cy="182" r="4.2" fill="url(#amberLight)" />
  <circle cx="161" cy="181" r="1.5" fill="#FFFFFF" fill-opacity="0.7" />
</svg>
