<svg width="256" height="256" viewBox="0 0 256 256" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Soft Ambient Ground Shadow -->
    <filter id="suvGroundShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="9" />
    </filter>
    <filter id="suvLightGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2.5" />
    </filter>

    <!-- Metallic Electric Blue Body Gradient -->
    <linearGradient id="suvBlueGrad" x1="40" y1="50" x2="220" y2="210" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="25%" stop-color="#0284C7" />
      <stop offset="65%" stop-color="#0369A1" />
      <stop offset="100%" stop-color="#075985" />
    </linearGradient>

    <!-- Sleek White Roof Gradient -->
    <linearGradient id="suvRoofGrad" x1="80" y1="40" x2="200" y2="150" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="60%" stop-color="#F1F5F9" />
      <stop offset="100%" stop-color="#CBD5E1" />
    </linearGradient>

    <!-- Dark Tinted Panoramic Glass Windows -->
    <linearGradient id="suvGlassGrad" x1="70" y1="60" x2="190" y2="170" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="45%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>

    <!-- Wheels / Low-Profile Tires -->
    <linearGradient id="suvTire" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#475569" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>

    <!-- Metallic Turbine Multi-Spoke Rims -->
    <linearGradient id="suvRim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="60%" stop-color="#CBD5E1" />
      <stop offset="100%" stop-color="#64748B" />
    </linearGradient>

    <!-- Red LED Horizontal Taillight Bar -->
    <linearGradient id="redLedBar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#EF4444" />
      <stop offset="50%" stop-color="#F87171" />
      <stop offset="100%" stop-color="#DC2626" />
    </linearGradient>
  </defs>

  <!-- 1. Realistic Floating Drop Shadow -->
  <ellipse cx="128" cy="192" rx="92" ry="46" fill="#000000" fill-opacity="0.45" filter="url(#suvGroundShadow)" />

  <!-- 2. Front-Left Low-Profile Wheel -->
  <g id="suvFrontWheel">
    <ellipse cx="60" cy="144" rx="17" ry="26" fill="url(#suvTire)" />
    <ellipse cx="57" cy="144" rx="11" ry="18" fill="url(#suvRim)" />
    <!-- 5 Spoke Turbine lines -->
    <line x1="57" y1="130" x2="57" y2="158" stroke="#334155" stroke-width="2.2" />
    <line x1="48" y1="138" x2="66" y2="150" stroke="#334155" stroke-width="2.2" />
    <line x1="48" y1="150" x2="66" y2="138" stroke="#334155" stroke-width="2.2" />
    <circle cx="57" cy="144" r="3.2" fill="#0284C7" />
  </g>

  <!-- Rear-Left Low-Profile Wheel -->
  <g id="suvRearWheel">
    <ellipse cx="140" cy="192" rx="20" ry="30" fill="url(#suvTire)" />
    <ellipse cx="136" cy="192" rx="13" ry="21" fill="url(#suvRim)" />
    <!-- 5 Spoke Turbine lines -->
    <line x1="136" y1="175" x2="136" y2="209" stroke="#334155" stroke-width="2.4" />
    <line x1="126" y1="184" x2="146" y2="200" stroke="#334155" stroke-width="2.4" />
    <line x1="126" y1="200" x2="146" y2="184" stroke="#334155" stroke-width="2.4" />
    <circle cx="136" cy="192" r="3.8" fill="#0284C7" />
  </g>

  <!-- 3. Metallic Electric Blue SUV Body -->
  <!-- Main Aerodynamic Body Contour -->
  <path d="M 46 122 C 38 104 54 78 84 66 C 112 54 154 52 188 64 C 220 76 238 102 236 128 C 234 152 216 172 192 182 C 160 196 116 198 88 190 C 64 182 48 162 46 138 Z" 
        fill="url(#suvBlueGrad)" />

  <!-- Lower Black Sport Cladding & Rear Skid Plate Diffuser -->
  <path d="M 68 158 C 84 174 122 186 160 184 C 182 182 208 174 224 158 L 222 168 C 204 182 174 192 148 194 C 114 194 82 184 64 168 Z" fill="#0F172A" />
  <path d="M 174 178 C 186 172 204 164 214 158 C 218 162 214 170 198 176 Z" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.2" />

  <!-- Side Aerodynamic Crease & Door Seam -->
  <path d="M 76 132 C 112 128 158 138 184 148" stroke="#38BDF8" stroke-width="2.0" stroke-linecap="round" fill="none" opacity="0.6" />
  <path d="M 124 116 C 122 140 118 162 116 176" stroke="#0369A1" stroke-width="1.8" stroke-linecap="round" fill="none" opacity="0.7" />

  <!-- Flush Door Handles -->
  <rect x="98" y="132" width="10" height="3" rx="1.5" fill="#0369A1" opacity="0.6" />
  <rect x="144" y="142" width="10" height="3" rx="1.5" fill="#0369A1" opacity="0.6" />

  <!-- 4. Pure White Aerodynamic Floating Roof Shell -->
  <path d="M 68 98 C 62 84 76 64 102 54 C 130 44 174 44 196 58 C 218 72 222 92 216 114 C 208 130 188 138 162 142 C 128 146 80 138 68 112 Z" 
        fill="url(#suvRoofGrad)" stroke="#FFFFFF" stroke-width="2.5" />

  <!-- Floating Roof Arch Chrome Trim Line -->
  <path d="M 70 94 C 84 76 114 54 156 50 C 186 48 208 62 218 84" stroke="#F8FAFC" stroke-width="3.0" stroke-linecap="round" fill="none" />

  <!-- Integrated White Roof Rails -->
  <line x1="98" y1="56" x2="182" y2="68" stroke="#CBD5E1" stroke-width="2.5" stroke-linecap="round" />
  <line x1="104" y1="64" x2="188" y2="76" stroke="#E2E8F0" stroke-width="2.2" stroke-linecap="round" />

  <!-- Subtle Shark-fin Antenna -->
  <path d="M 176 74 L 186 72 L 184 78 Z" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="0.8" />

  <!-- 5. Dark Panoramic Tinted Glass -->
  <!-- Front Windshield -->
  <path d="M 74 94 C 72 86 78 76 90 70 C 104 64 122 62 132 66 L 122 92 C 108 92 86 94 74 94 Z" 
        fill="url(#suvGlassGrad)" />
  <path d="M 80 84 L 92 74 L 106 72 L 88 88 Z" fill="#FFFFFF" fill-opacity="0.25" />

  <!-- Side Windows (Front & Rear Integrated Sleek Cut) -->
  <path d="M 76 104 C 74 110 76 118 82 122 C 92 128 106 130 114 128 L 118 106 C 106 104 92 102 76 104 Z" 
        fill="url(#suvGlassGrad)" />
  <path d="M 124 106 L 120 128 C 142 130 156 126 164 114 L 158 100 C 146 102 134 104 124 106 Z" 
        fill="url(#suvGlassGrad)" />
  <path d="M 82 110 L 106 106 L 104 118 L 84 120 Z" fill="#FFFFFF" fill-opacity="0.2" />

  <!-- Rear Windshield -->
  <path d="M 166 100 L 172 134 C 194 130 212 120 216 106 C 220 94 212 82 202 76 C 188 68 174 74 166 84 Z" 
        fill="url(#suvGlassGrad)" />
  <path d="M 174 88 L 198 84 C 206 92 208 102 206 112 L 188 122 Z" fill="#FFFFFF" fill-opacity="0.22" />

  <!-- 6. Modern Full-Width Horizontal Rear LED Lightbar with Waze Smiley Logo -->
  <g id="suvRearLightbar">
    <path d="M 152 144 C 172 142 214 130 228 120" stroke="url(#redLedBar)" stroke-width="4.5" stroke-linecap="round" filter="url(#suvLightGlow)" />
    <path d="M 152 144 C 172 142 214 130 228 120" stroke="#FECACA" stroke-width="2.0" stroke-linecap="round" />
    <circle cx="154" cy="144" r="3.2" fill="#EF4444" />
    <circle cx="228" cy="120" r="3.2" fill="#EF4444" />
  </g>

  <!-- Cute Waze Smiley Emblem on Rear Tailgate -->
  <g transform="translate(196, 126)">
    <circle cx="8" cy="8" r="8" fill="#38BDF8" stroke="#FFFFFF" stroke-width="1.2" />
    <!-- Eyes -->
    <circle cx="5.5" cy="6.5" r="1.1" fill="#0F172A" />
    <circle cx="10.5" cy="6.5" r="1.1" fill="#0F172A" />
    <!-- Smile -->
    <path d="M 5 9.5 C 6.5 12 9.5 12 11 9.5" stroke="#0F172A" stroke-width="1.2" stroke-linecap="round" fill="none" />
  </g>

  <!-- Front Sleek LED Headlights -->
  <g id="suvFrontHeadlights">
    <path d="M 44 112 C 40 108 42 102 48 98 L 56 94" stroke="#FDE047" stroke-width="3.5" stroke-linecap="round" filter="url(#suvLightGlow)" />
    <path d="M 44 112 C 40 108 42 102 48 98 L 56 94" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round" />
  </g>

  <!-- Two-tone Aerodynamic Side Mirror -->
  <g transform="translate(58, 92)">
    <path d="M 4 8 C 0 8 -1 12 2 14 C 5 15 8 13 8 10 Z" fill="#0284C7" stroke="#FFFFFF" stroke-width="1.2" />
  </g>
</svg>
